pointer;font-size:11px}.primary{border-color:transparent;background:linear-gradient(90deg,var(--blue),var(--violet));color:#fff}.hero{margin:14px 0 12px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--blue);background:var(--panel);display:flex;align-items:center;gap:18px}.hero strong{font-size:13px}.hero p{margin:4px 0 0;color:var(--muted);font-size:10px}.hero-count{min-width:72px;color:#a994ff;font-size:25px;font-weight:850}.toolbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel)}.toolbar-label{color:var(--muted);font-size:10px;margin-right:4px}.filter{height:30px;padding:0 11px;border-radius:6px;font-size:11px}.filter.active{border-color:var(--blue);background:#182541;color:#fff}.search{height:30px;min-width:180px;margin-left:auto;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--text);font-size:11px}.status{margin-left:5px;color:var(--muted);font-size:10px}.queue{display:grid;grid-template-columns:repeat(auto-fit,minmax(540px,1fr));gap:12px}.signal{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}.signal-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.signal-head strong{font-size:15px}.signal-symbol{color:var(--muted);font-size:10px}.signal-pool{margin-left:auto;color:#b9c7dc;font-size:10px;padding:4px 7px;border-radius:4px;background:var(--soft)}.action{font-size:11px;font-weight:800}.buy{color:var(--up)}.sell{color:var(--down)}.add{color:var(--warn)}.hold{color:var(--muted)}.signal-select{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}.signal-select-label{display:inline-flex;align-items:center;justify-content:center;padding:2px;border-radius:5px;background:rgba(102,141,255,.08)}.signal-body{padding:13px 15px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 13px}.stat{min-width:0}.stat span,.detail-item span{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.stat strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.advice{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--soft);font-size:11px;line-height:1.6}.advice span{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.detail{margin:0 15px 15px;border:1px solid var(--line);border-radius:7px;background:#0e1526}.detail summary{cursor:pointer;padding:11px 12px;color:#9db4ff;font-size:11px;font-weight:750}.detail-inner{padding:0 12px 12px}.detail-section{padding:11px 0;border-top:1px solid var(--line)}.detail-section:first-child{border-top:0}.detail-section h3{margin:0 0 8px;color:#a994ff;font-size:11px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px}.detail-item{min-width:0}.detail-item strong{display:block;white-space:pre-wrap;word-break:break-word;font-size:10px;line-height:1.5;font-weight:550}.detail-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}.detail-list li{color:#cbd6e8;font-size:10px;line-height:1.5;padding-left:12px;position:relative}.detail-list li:before{content:"";position:absolute;left:0;top:6px;width:4px;height:4px;background:var(--blue);border-radius:50%}.empty{padding:45px;text-align:center;color:var(--muted);border:1px dashed var(--line);background:var(--panel)}.error{padding:14px;border:1px solid #6e2936;background:#34151d;color:#ff7180;border-radius:7px;font-size:11px}@media(max-width:1000px){.shell{grid-template-columns:72px minmax(0,1fr)}.brand span,.nav span,.meta,.back span{display:none}.brand{padding:0 5px 22px}.nav a,.back{justify-content:center;padding:0}}@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:block;padding:10px 14px}.brand,.meta{display:none}.back{display:inline-flex;width:auto;margin:0 0 8px;padding:0 10px}.back span{display:inline}.nav{display:flex;overflow:auto}.nav a{min-width:max-content;padding:0 10px}.nav span{display:inline}.main{padding:14px}.topbar{display:block}.actions{margin-top:12px}.toolbar{flex-wrap:wrap}.search{margin-left:0;flex:1}.queue{grid-template-columns:1fr}}@media(max-width:560px){.hero{align-items:flex-start}.hero-count{min-width:58px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-grid{grid-template-columns:1fr}.title{font-size:21px}}

<body><div class="shell"><aside class="sidebar"><div class="brand"><img src="docs/assets/akquant-icon.svg" alt="AKQuant"><span>AKQuant AI</span></div><a class="back" href="akquant_review_center.html"><i class="ph ph-arrow-left"></i><span>返回复盘中心</span></a><nav class="nav"><a href="akquant_review_center.html"><i class="ph ph-squares-four"></i><span>今日研判</span></a><a class="active" href="signal_center.html"><i class="ph ph-broadcast"></i><span>信号中心</span></a><a href="model_management.html"><i class="ph ph-git-branch"></i><span>模型发布</span></a><a href="examples/report_and_analysis_outputs.html?live=1"><i class="ph ph-file-chart"></i><span>回测报告</span></a></nav><div class="meta">Signal Intelligence Console<br>数据来源 复盘中心实时接口<br>生成日期 2026-08-27</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">AKQUANT · SIGNAL INTELLIGENCE</div><h1 class="title">信号中心</h1><p class="subtitle">集中查看每只个股的传统逻辑、模型判断、融合依据与执行计划。</p></div><div class="actions"><button id="refresh" class="primary"><i class="ph ph-arrows-clockwise"></i>刷新队列</button><button id="analyze-selected" class="primary"><i class="ph ph-sparkle"></i>分析选中</button><button id="research-full"><i class="ph ph-play"></i>运行全流程</button><button id="research-backtest"><i class="ph ph-chart-line-up"></i>回测</button><button id="research-labels"><i class="ph ph-tag"></i>更新标签</button><button id="research-metrics"><i class="ph ph-chart-bar"></i>更新指标</button><button id="research-train"><i class="ph ph-brain"></i>训练评估</button><button id="theme"><i class="ph ph-moon"></i>切换主题</button></div></header><section class="hero"><div id="count" class="hero-count">—</div><div><strong>待研判信号已集中到独立工作区</strong><p>勾选个股后点击“分析选中”，调用 LLM 生成结构化判断；研究按钮只使用当前持仓池和观察池，不接入真实账户。</p><div id="research-status" class="status">研究流程状态：未运行</div></div></section><div class="toolbar"><span class="toolbar-label">信号筛选</span><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="actionable">可执行</button><button class="filter" data-filter="watch">观察</button><span id="selected-count" class="status">已选 0 只</span><input id="search" class="search" type="search" placeholder="搜索股票名称或代码"><span id="status" class="status">正在读取</span></div><section id="queue" class="queue"></section></main></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),queue=$('#queue'),count=$('#count'),status=$('#status'),selectedCount=$('#selected-count'),analyzeSelected=$('#analyze-selected'),search=$('#search'),theme=$('#theme'),researchStatus=$('#research-status');const researchButtons={full:$('#research-full'),backtest:$('#research-backtest'),labels:$('#research-labels'),metrics:$('#research-metrics'),train:$('#research-train')};let data=[],filter='all',selectedAiSymbols={};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const val=v=>{if(v===null||v===undefined||v==='')return '—';if(Array.isArray(v))return v.length?v.map(val).join('；'):'—';if(typeof v==='object')return Object.keys(v).map(k=>k+'：'+val(v[k])).join('；')||'—';return String(v)};
const pct=v=>{const n=Number(v);return Number.isFinite(n)?(n*100).toFixed(1)+'%':'—'};const money=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString('zh-CN',{maximumFractionDigits:2}):'—'};
const action=s=>s.final_action||s.action||'观察';const actionClass=a=>a==='买入'?'buy':['卖出','减仓','止损','清仓'].includes(a)?'sell':a==='加仓'?'add':'hold';
const detailSection=(title,items)=>'<section class="detail-section"><h3>'+esc(title)+'</h3><div class="detail-grid">'+items.map(([k,v])=>'<div class="detail-item"><span>'+esc(k)+'</span><strong>'+esc(val(v))+'</strong></div>').join('')+'</div></section>';
const listSection=(title,items)=>{const arr=Array.isArray(items)?items:[];return '<section class="detail-section"><h3>'+esc(title)+'</h3>'+(arr.length?'<ul class="detail-list">'+arr.map(x=>'<li>'+esc(typeof x==='object'?(x.summary||x.reference||val(x)):x)+'</li>').join('')+'</ul>':'<div class="detail-item"><strong>暂无</strong></div>')+'</section>'};
function advice(s){const llm=s.llm||{},sc=llm.next_day_scenario||{},base=s.operation_advice||s.evaluation||s.reason||'—',parts=[];if(sc.base_case)parts.push('基准：'+sc.base_case);if(sc.bullish_case)parts.push('偏强：'+sc.bullish_case);if(sc.bearish_case)parts.push('偏弱：'+sc.bearish_case);if(sc.open_plan)parts.push('开盘：'+sc.open_plan);if(sc.hold_plan)parts.push('持有：'+sc.hold_plan);if(sc.exit_plan)parts.push('退出：'+sc.exit_plan);return base+(parts.length?' ｜ 明日走势预案：'+parts.join(' ｜ '):'')}
function validationSummary(item){const v=(item||{}).validation||{};if(!Object.keys(v).length)return '暂无验证结果';const parts=[];if(v.method)parts.push('方法 '+v.method);if(v.sample_count!=null)parts.push('样本 '+v.sample_count);if(v.accuracy!=null)parts.push('准确率 '+(Number(v.accuracy)*100).toFixed(1)+'%');if(v.brier_score!=null)parts.push('Brier '+Number(v.brier_score).toFixed(3));if(v.auc!=null)parts.push('AUC '+Number(v.auc).toFixed(3));return parts.join(' · ')||'暂无验证结果'}
function card(s){const f=s.fusion||{},plans=f.plans||{},buy=plans.buy||plans.add||{},zone=buy.price_zone||(f.price_plan||{}).buy||{},pos=buy.position||{},stop=(plans.stop_loss||{}).price_zone||{},sell=plans.sell||plans.reduce||{},exit=(sell.position||{}).target_exit_ratio;const next=s.final_next_day_probability??((s.probabilities||{}).next_trading_day||{}).value,day5=s.final_five_day_probability??((s.probabilities||{}).next_5_trading_days||{}).value,a=action(s),llm=s.llm||{};let html='<article class="signal"><div class="signal-head"><label class="signal-select-label" title="选择后调用 LLM"><input type="checkbox" class="signal-select" data-symbol="'+esc(s.symbol||'')+'" '+(selectedAiSymbols[s.symbol]?'checked':'')+' aria-label="选择 '+esc(s.name||s.symbol||'')+' 进行大模型分析"></label><strong>'+esc(s.name||s.symbol)+'</strong><span class="signal-symbol">'+esc(s.symbol||'')+'</span><span class="signal-pool">'+esc(s.pool||'—')+'</span><span class="action '+actionClass(a)+'">'+esc(a)+'</span></div><div class="signal-body"><div class="stats">'+[['现价',money(s.current_price)],['持仓收益',s.position_return==null?'—':pct(s.position_return)],['短线趋势',f.final_trend_direction||s.trend_direction||s.trend],['次日概率',pct(next)],['5日概率',pct(day5)],['评分',s.final_score==null?(s.selection_score??'—'):Number(s.final_score).toFixed(1)],['大盘/板块',(llm.market_effect||'未知')+'/'+(llm.sector_effect||'未知')],['质量/冲突',(s.assessment_status||'未知')+' / '+(f.conflict_level||'none')],['触发价格',zone.lower&&zone.upper?money(zone.lower)+'–'+money(zone.upper):(s.suggested_price?money(s.suggested_price):'—')],['仓位%/数量',pos.target_weight==null?'—':pct(pos.target_weight)+' / '+money(pos.quantity)],['卖出比例/止损',(exit==null?'—':pct(exit))+' / '+money(stop.trigger_price||s.stop_price)],['更新时间',s.ai_as_of||s.updated_at||'—']].map(([k,v])=>'<div class="stat"><span>'+esc(k)+'</span><strong>'+esc(val(v))+'</strong></div>').join('')+'</div><div class="advice"><span>操作建议与明日走势预案</span>'+esc(advice(s))+'</div></div><details class="detail"><summary>展开选股细分理由 / LLM / 融合依据</summary><div class="detail-inner">';
html+=detailSection('传统逻辑与选股依据',[['选择评分',s.selection_score],['趋势方向',s.trend_direction||s.trend],['次日上涨概率',pct(next)],['5日上涨概率',pct(day5)],['次日验证',validationSummary((s.probabilities||{}).next_trading_day)],['5日验证',validationSummary((s.probabilities||{}).next_5_trading_days)],['20日动量',s.momentum20],['60日动量',s.momentum60],['MA5 / MA20 / MA60',(s.ma5||'—')+' / '+(s.ma20||'—')+' / '+(s.ma60||'—')],['RSI14',s.rsi14],['量比',s.volume_ratio],['ATR14',s.atr14],['支撑位',s.support_price],['压力位',s.resistance_price],['触发条件',s.trigger],['判定理由',s.reason],['数据状态',s.assessment_status]]);
html+=detailSection('LLM 细分判断',[['状态',llm.assessment_status||'尚未运行 LLM 分析'],['评分',llm.score],['置信度',llm.confidence],['趋势',llm.trend_direction],['市场环境',llm.market_regime],['大盘影响',llm.market_effect],['板块强度',llm.sector_strength],['板块影响',llm.sector_effect],['立场',llm.stance],['建议动作',llm.suggested_action],['操作建议',llm.operation_advice],['模型输出',llm.model_output]]);html+=listSection('使用事实',llm.facts_used)+listSection('支持证据',llm.evidence)+listSection('反向证据',llm.counter_evidence)+listSection('推断',llm.inferences)+listSection('失效条件',llm.invalidation_conditions)+listSection('缺失信息',llm.missing_information)+listSection('经验规则',llm.knowledge_refs);
html+=detailSection('传统与 LLM 融合依据',[['最终动作',f.final_action],['最终趋势',f.final_trend_direction],['最终评分',f.final_score],['最终概率',f.final_up_probabilities],['权重',f.weights],['评分修正',f.adjustments&&f.adjustments.score_delta],['概率修正',f.adjustments&&f.adjustments.probability_deltas],['动作修正级别',f.adjustments&&f.adjustments.action_step_delta],['冲突等级',f.conflict_level],['需人工复核',f.human_review_required?'是':'否'],['硬约束',f.vetoes],['融合摘要',f.summary]]);return html+'</div></details></article>'}
function render(){const q=search.value.trim().toLowerCase(),shown=data.filter(s=>{const a=action(s),ok=filter==='all'||(filter==='actionable'?a!=='观察':a==='观察');return ok&&(!q||String(s.name||'').toLowerCase().includes(q)||String(s.symbol||'').toLowerCase().includes(q))});count.textContent=shown.length;selectedCount.textContent='已选 '+Object.keys(selectedAiSymbols).length+' 只';status.textContent='共 '+data.length+' 条 · 已显示 '+shown.length+' 条';queue.innerHTML=shown.length?shown.map(card).join(''):'<div class="empty">当前筛选条件下没有信号</div>';queue.querySelectorAll('.signal-select').forEach(function(box){box.addEventListener('change',function(){if(box.checked)selectedAiSymbols[box.dataset.symbol]=true;else delete selectedAiSymbols[box.dataset.symbol];selectedCount.textContent='已选 '+Object.keys(selectedAiSymbols).length+' 只';});});}
async function analyzeSelectedSignals(){const symbols=Object.keys(selectedAiSymbols);if(!symbols.length){window.alert('请先勾选要分析的股票');return;}analyzeSelected.disabled=true;analyzeSelected.innerHTML='<i class="ph ph-spinner-gap"></i>分析中…';status.textContent='正在调用 LLM 分析 '+symbols.length+' 只股票…';try{const r=await fetch('/api/ai/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:symbols})});const body=await r.json();if(!r.ok)throw Error(body.error||('HTTP '+r.status));const failures=(body.results||[]).filter(item=>item.error);status.textContent=failures.length?'完成，'+failures.length+' 只失败':'LLM 分析完成';await load();}catch(error){status.textContent='LLM 分析失败';window.alert(error.message||String(error));}finally{analyzeSelected.disabled=false;analyzeSelected.innerHTML='<i class="ph ph-sparkle"></i>分析选中';}}
async function runResearch(action){const button=researchButtons[action];if(!button)return;Object.values(researchButtons).forEach(b=>{if(b)b.disabled=true});researchStatus.textContent='研究流程状态：正在执行 '+action+' …';try{const r=await fetch('/api/research/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,calendar_days:60,refresh:true})});const body=await r.json();if(!r.ok)throw Error(body.error||('HTTP '+r.status));const result=body.result||{};researchStatus.textContent='研究流程状态：'+action+' 已完成 · run_id='+body.run_id;status.textContent='研究任务完成';if(action==='full'||action==='labels')await load();if(result.backtest&&result.backtest.summary)console.info('研究回测摘要',result.backtest.summary);if(result.training)console.info('候选训练评估',result.training);}catch(error){researchStatus.textContent='研究流程状态：'+action+' 失败';status.textContent='研究任务失败';window.alert(error.message||String(error));}finally{Object.values(researchButtons).forEach(b=>{if(b)b.disabled=false});}}
async function loadResearchStatus(){try{const r=await fetch('/api/research/status',{cache:'no-store'});const body=await r.json();const latest=(body.latest_runs||[])[0];if(latest)researchStatus.textContent='研究流程状态：最近 '+latest.action+' · '+latest.status+' · '+(latest.finished_at||latest.started_at);}catch(error){console.warn('研究状态读取失败',error)}}
async function load(force=false){status.textContent=force?'正在刷新行情与信号…':'正在读取信号缓存…';try{const r=await fetch('/api/pools'+(force?'?refresh=1':''),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const body=await r.json();data=body.signals||[];render();if(body.cache&&body.cache.status==='hit')status.textContent+=' · 缓存行情，点击刷新可更新'}catch(e){queue.innerHTML='<div class="error">读取信号中心失败：'+esc(e.message)+'</div>';status.textContent='读取失败';console.error(e)}}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()}));search.addEventListener('input',render);$('#refresh').addEventListener('click',()=>load(true));analyzeSelected.addEventListener('click',analyzeSelectedSignals);Object.keys(researchButtons).forEach(action=>{const button=researchButtons[action];if(button)button.addEventListener('click',()=>runResearch(action));});theme.addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';theme.innerHTML=dark?'<i class="ph ph-sun"></i>切换亮色':'<i class="ph ph-moon"></i>切换暗色'});loadResearchStatus();load(false);})();
const executeButton=document.createElement('button');executeButton.className='primary';executeButton.id='execute-local-signals';executeButton.innerHTML='<i class="ph ph-check-circle"></i>执行本地模拟信号';document.querySelector('.actions').insertBefore(executeButton,document.getElementById('theme'));executeButton.addEventListener('click',async()=>{if(!window.confirm('仅写入本地持仓池和模拟交易，确认执行当前可执行信号？'))return;executeButton.disabled=true;const statusNode=document.getElementById('research-status');if(statusNode)statusNode.textContent='研究流程状态：正在执行本地模拟信号…';try{const r=await fetch('/api/research/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:true,refresh:false}),cache:'no-store'});const body=await r.json();if(!r.ok)throw Error(body.error||('HTTP '+r.status));const applied=(body.applied||[]),skipped=(body.skipped||[]),insufficient=skipped.filter(x=>x.reason_code==='insufficient_cash'||String(x.reason||'').includes('可用现金'));const notable=insufficient.length?insufficient:skipped.filter(x=>x.reason_code!=='not_actionable');const reason=notable.slice(0,3).map(x=>(x.name||x.symbol||'标的')+'：'+x.reason).join('；');const cashBefore=Number(body.available_cash_before||0),cashAfter=Number(body.available_cash_after??cashBefore);const message=applied.length?'已执行 '+applied.length+' 笔本地模拟交易，剩余现金 '+cashAfter.toFixed(2)+' 元':'未执行交易；可用现金 '+cashBefore.toFixed(2)+' 元'+(reason?'；'+reason:'；当前没有可执行信号');if(statusNode)statusNode.textContent='研究流程状态：'+message;window.alert(message);await load(false);}catch(error){if(statusNode)statusNode.textContent='研究流程状态：本地模拟执行失败：'+(error.message||String(error));window.alert(error.message||String(error));}finally{executeButton.disabled=false;}});</script></body></html>
